<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electronics Store</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <h1 class="logo">⚡ Electronics Store</h1>
      <nav class="nav" id="nav-auth">
        <button class="btn btn--ghost" data-view="login">Log in</button>
        <button class="btn btn--primary" data-view="register">Sign up</button>
      </nav>
      <nav class="nav hidden" id="nav-user">
        <span class="nav__user" id="username-label"></span>
        <button class="btn btn--ghost" id="logout-btn">Log out</button>
      </nav>
    </div>
  </header>

  <main class="container main">
    <section id="view-login" class="card view hidden">
      <h2>Log in</h2>
      <form id="login-form" class="form">
        <label>Username<input name="username" required autocomplete="username" /></label>
        <label>Password<input name="password" type="password" required autocomplete="current-password" /></label>
        <button type="submit" class="btn btn--primary">Sign in</button>
        <p class="form__error" id="login-error"></p>
      </form>
    </section>

    <section id="view-register" class="card view hidden">
      <h2>Sign up</h2>
      <form id="register-form" class="form">
        <label>Username<input name="username" required autocomplete="username" /></label>
        <label>Password (min. 6 characters)<input name="password" type="password" minlength="6" required autocomplete="new-password" /></label>
        <button type="submit" class="btn btn--primary">Create account</button>
        <p class="form__error" id="register-error"></p>
      </form>
    </section>

    <section id="view-catalog" class="view hidden">
      <div class="toolbar">
        <h2>Catalog</h2>
        <div class="toolbar__actions">
          <select id="filter-brand"><option value="">All brands</option></select>
          <select id="filter-category"><option value="">All categories</option></select>
          <button class="btn btn--primary" id="refresh-products">Refresh</button>
        </div>
      </div>
      <div id="products-grid" class="grid"></div>
      <nav class="pagination hidden" id="catalog-pagination" aria-label="Catalog pagination">
        <button type="button" class="btn btn--ghost" id="pagination-prev" disabled>Previous</button>
        <span class="pagination__info" id="pagination-info">Page 1</span>
        <button type="button" class="btn btn--ghost" id="pagination-next">Next</button>
      </nav>
    </section>

    <section id="view-product" class="view hidden">
      <button class="btn btn--ghost back-btn" data-view="catalog">← Back</button>
      <div id="product-detail" class="card"></div>
      <div class="card">
        <h3>Reviews</h3>
        <div id="reviews-list"></div>
        <form id="review-form" class="form hidden">
          <label>Rating (1–5)<input name="rating" type="number" min="1" max="5" required /></label>
          <label>Comment<textarea name="comment" rows="3"></textarea></label>
          <button type="submit" class="btn btn--primary">Submit review</button>
        </form>
      </div>
    </section>

    <section id="view-admin" class="view hidden">
      <h2>Admin</h2>
      <div class="admin-grid">
        <div class="card">
          <h3>Brands</h3>
          <form id="brand-form" class="form form--inline">
            <input name="name" placeholder="Brand name" required />
            <button type="submit" class="btn btn--primary">Add</button>
          </form>
          <ul id="brands-list" class="list"></ul>
        </div>
        <div class="card">
          <h3>Categories</h3>
          <form id="category-form" class="form form--inline">
            <input name="name" placeholder="Category name" required />
            <button type="submit" class="btn btn--primary">Add</button>
          </form>
          <ul id="categories-list" class="list"></ul>
        </div>
        <div class="card card--wide">
          <h3>New product</h3>
          <form id="product-form" class="form">
            <label>Name<input name="name" required /></label>
            <label>Price<input name="price" type="number" step="0.01" min="0.01" required /></label>
            <label>Stock<input name="stock" type="number" min="0" value="0" /></label>
            <label>Brand<select name="brand_id" required></select></label>
            <label>Category<select name="category_id" required></select></label>
            <button type="submit" class="btn btn--primary">Create product</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav hidden" id="bottom-nav">
    <button data-view="catalog">Catalog</button>
    <button data-view="admin">Admin</button>
  </nav>

  <div id="toast" class="toast hidden"></div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
